<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="flow-page">
<div class="flow-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header-title">
    <div id="headerTitle">Feedback</div>
    <div class="header-subtitle">Step 7 of 7</div>
  </div>
  <span class="lang-badge" id="langBadge">EN</span>
</div>
<div class="step-indicator" id="stepIndicator"></div>
<div class="flow-content">
  <div class="section-card blue-card">
    <div class="card-icon">💬</div>
    <div class="card-title" id="step7Title">Feedback / Update Data</div>
    <div class="card-desc" id="step7Desc">Help us improve by sharing your experience</div>
  </div>
  <div class="section-card" id="feedbackForm">
    <div class="card-title" id="rateLabel" style="text-align:center;">Rate the Advisory</div>
    <div class="stars" id="starRating">
      <span class="star" data-val="1" onclick="rateStar(1)">★</span>
      <span class="star" data-val="2" onclick="rateStar(2)">★</span>
      <span class="star" data-val="3" onclick="rateStar(3)">★</span>
      <span class="star" data-val="4" onclick="rateStar(4)">★</span>
      <span class="star" data-val="5" onclick="rateStar(5)">★</span>
    </div>
    <div id="ratingLabel" style="text-align:center;font-size:0.85rem;color:var(--text-light);min-height:1.2rem;margin-bottom:1rem;"></div>
    <div class="form-group">
      <label class="form-label" id="feedbackLabel">Your Feedback</label>
      <textarea class="form-input feedback-textarea" id="feedbackText" placeholder="Share your experience..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label"><span id="lCropResult">Actual crop planted / result observed</span></label>
      <input class="form-input" id="cropResult" type="text" />
    </div>
    <div id="submitError" style="display:none;padding:0.5rem;background:#ffe0e0;color:#c00;border-radius:6px;margin-bottom:0.5rem;"></div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitFeedback()">Submit Feedback</button>
  </div>
  <div id="thankYouCard" style="display:none;animation:fadeUp 0.5s ease;">
    <div class="section-card" style="text-align:center;padding:2.5rem 1.5rem;">
      <div style="font-size:4rem;margin-bottom:1rem;">🙏</div>
      <div style="font-family:'Noto Sans Devanagari','DM Sans',sans-serif;font-size:1.2rem;font-weight:700;color:var(--green-dark);margin-bottom:0.5rem;" id="thankYouMsg">Thank you for your feedback!</div>
      <div style="font-size:0.85rem;color:var(--text-light);margin-bottom:1.5rem;" id="summaryMsg">Your advisory cycle is complete.</div>
      <div id="summaryBox" style="background:var(--cream-dark);border-radius:12px;padding:1rem;text-align:left;margin-bottom:1.5rem;"></div>
    </div>
    <button class="btn btn-orange" id="startOverBtn" onclick="startOver()">🌾 Start New Advisory</button>
  </div>
</div>
<script src="../js/translations.js"></script>
<script src="../js/api.js"></script>
<script>
const t = getT(); const lang = getLang();
const farmer = JSON.parse(localStorage.getItem('farmerData') || '{}');
const reco = JSON.parse(localStorage.getItem('aiRecommendations') || '{}');
document.getElementById('headerTitle').textContent = t.appTitle;
document.getElementById('langBadge').textContent = lang.toUpperCase();
document.getElementById('step7Title').textContent = t.step7Title;
document.getElementById('step7Desc').textContent = t.step7Desc;
document.getElementById('rateLabel').textContent = t.rateAdvice;
document.getElementById('feedbackLabel').textContent = lang==='hi'?'आपकी प्रतिक्रिया':lang==='mr'?'आपला अभिप्राय':'Your Feedback';
document.getElementById('feedbackText').placeholder = t.feedbackPlaceholder;
document.getElementById('submitBtn').textContent = t.submitFeedback;
document.getElementById('thankYouMsg').textContent = t.thankYou;
document.getElementById('startOverBtn').textContent = '🌾 ' + t.startOver;
document.getElementById('lCropResult').textContent = lang==='hi'?'वास्तविक फसल / परिणाम':lang==='mr'?'प्रत्यक्ष पीक / परिणाम':'Actual crop planted / result observed';
document.getElementById('summaryMsg').textContent = {en:'Your advisory cycle is complete. Data saved to database.',hi:'आपका सलाह चक्र पूरा हुआ। डेटा डेटाबेस में सहेजा गया।',mr:'आपला सल्ला चक्र पूर्ण झाला. डेटा डेटाबेसमध्ये जतन केला आहे.'}[lang]||'Advisory cycle complete.';

const si = document.getElementById('stepIndicator');
t.steps.forEach((s,i) => { const d=document.createElement('div'); d.className='step-dot'+(i===6?' active':i<6?' done':''); d.innerHTML=`<div class="dot-circle">${i<6?'✓':i+1}</div><div class="step-dot-label">${s}</div>`; si.appendChild(d); });

const ratingLabels = {en:['','Poor','Fair','Good','Very Good','Excellent!'],hi:['','खराब','ठीक','अच्छा','बहुत अच्छा','उत्कृष्ट!'],mr:['','वाईट','ठीक','चांगले','खूप चांगले','उत्कृष्ट!']};
let selectedRating = 0;
function rateStar(val) {
  selectedRating = val;
  document.querySelectorAll('.star').forEach((s,i) => { s.className = i<val?'star selected':'star'; });
  const labels = ratingLabels[lang]||ratingLabels.en;
  document.getElementById('ratingLabel').textContent = labels[val]||'';
}

async function submitFeedback() {
  if (!selectedRating) {
    const em=document.getElementById('submitError');
    em.textContent=lang==='hi'?'कृपया रेटिंग दें।':lang==='mr'?'कृपया रेटिंग द्या.':'Please give a rating.';
    em.style.display='block'; return;
  }
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Saving...';
  try {
    await CropAPI.saveFeedback({
      rating: selectedRating,
      feedback_text: document.getElementById('feedbackText').value,
      crop_result: document.getElementById('cropResult').value
    });
    showThankYou();
  } catch(e) {
    // Still show thank you even if network fails
    console.warn('Feedback save failed:', e.message);
    showThankYou();
  }
}

function showThankYou() {
  document.getElementById('feedbackForm').style.display='none';
  document.getElementById('thankYouCard').style.display='block';
  const summaryItems = [
    {label:{en:'Farmer',hi:'किसान',mr:'शेतकरी'},value:farmer.name},
    {label:{en:'Location',hi:'स्थान',mr:'स्थान'},value:farmer.loc},
    {label:{en:'Crop',hi:'फसल',mr:'पीक'},value:farmer.crop},
    {label:{en:'Rating',hi:'रेटिंग',mr:'रेटिंग'},value:'★'.repeat(selectedRating)+'☆'.repeat(5-selectedRating)},
    {label:{en:'AI Recommendation',hi:'AI सिफारिश',mr:'AI शिफारस'},value:reco.crop||'--'}
  ];
  const box=document.getElementById('summaryBox');
  summaryItems.forEach(item => {
    const div=document.createElement('div');
    div.style.cssText='display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid #e8d5b0;font-size:0.82rem;';
    div.innerHTML=`<span style="color:var(--text-light)">${item.label[lang]||item.label.en}</span><span style="font-weight:600;color:var(--text-dark)">${item.value||'--'}</span>`;
    box.appendChild(div);
  });
}

function startOver() {
  ['farmerData','weatherData','soilAnalysis','aiRecommendations','cropPhotos','farmerId'].forEach(k=>localStorage.removeItem(k));
  window.location.href='../index.html';
}
</script>
</body>
</html>
